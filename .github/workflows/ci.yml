name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        rails: ["~> 7.2.0", "~> 8.0.0", "~> 8.1.0"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  # One check named `test` for every Ruby × Rails entry: `.talooner/config.yaml`
  # maps pr.tests_passing to it, and matrix jobs report under longer names.
  test:
    needs: specs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.specs.result }}" = success

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: gem build talooner-qa-rails.gemspec
